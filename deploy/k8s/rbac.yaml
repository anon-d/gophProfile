apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: avatar-service
  labels:
    app: avatar-service
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["avatar-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: avatar-service
  labels:
    app: avatar-service
subjects:
  - kind: ServiceAccount
    name: avatar-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: avatar-service

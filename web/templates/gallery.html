<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Gallery — {{.UserID}}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Avatar Gallery</h1>
        <p class="text-white/80 text-center mt-2">User: {{.UserID}}</p>
      </header>

      <main class="p-6">
        <div class="flex justify-between items-center mb-6">
          <a href="/web/upload"
            class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition-all">
            ← Upload New
          </a>
          <span class="text-white/60 text-sm">
            {{len .Avatars}} avatar(s)
          </span>
        </div>

        {{if .Avatars}}
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          {{range .Avatars}}
          <div class="bg-white/5 rounded-xl border border-white/10 overflow-hidden hover:border-purple-500/50 transition-all group">
            <div class="aspect-square overflow-hidden">
              <img src="/api/v1/avatars/{{.ID}}" alt="{{.FileName}}"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            </div>
            <div class="p-3 space-y-1">
              <p class="text-white text-sm font-medium truncate">{{.FileName}}</p>
              <p class="text-white/50 text-xs">{{.MimeType}}</p>
              <div class="flex items-center gap-2">
                <span class="inline-block px-2 py-0.5 rounded-full text-xs
                  {{if eq .ProcessingStatus "completed"}}bg-green-500/20 text-green-300
                  {{else if eq .ProcessingStatus "processing"}}bg-yellow-500/20 text-yellow-300
                  {{else if eq .ProcessingStatus "failed"}}bg-red-500/20 text-red-300
                  {{else}}bg-blue-500/20 text-blue-300{{end}}">
                  {{.ProcessingStatus}}
                </span>
              </div>
            </div>
          </div>
          {{end}}
        </div>
        {{else}}
        <div class="text-center py-12">
          <p class="text-white/60 text-lg">No avatars uploaded yet</p>
          <a href="/web/upload" class="text-purple-400 hover:text-purple-300 mt-2 inline-block">Upload your first avatar →</a>
        </div>
        {{end}}
      </main>
    </div>
  </div>
</body>

</html>
